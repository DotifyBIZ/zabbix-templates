apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: zabbix-templates
  title: Zabbix templates
  description: >-
    Zabbix 6.0 SNMPv2 monitoring templates for QNAP and Synology DiskStation NAS
    devices, with discovery of disks, pools, volumes and system hardware, and
    triggers for what they find.
  annotations:
    github.com/project-slug: DotifyBIZ/zabbix-templates
    backstage.io/source-location: url:https://github.com/DotifyBIZ/zabbix-templates
    backstage.io/techdocs-ref: dir:.
  tags:
    - zabbix
    - snmp
    - monitoring
spec:
  type: library
  lifecycle: production
  # TR-ITOperations
  owner: group:default/1c2b973e-7b63-4f3b-bca4-17c950dfb1b6
  dependsOn:
    # The templates are imported into Dotify's Zabbix.
    - component:default/zabbix
